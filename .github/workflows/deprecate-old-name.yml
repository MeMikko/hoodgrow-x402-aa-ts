name: Deprecate old npm name

# One-off, manually triggered: this repo published under the name
# hoodgrow-x402-aa before the rename to x402-aa-wallet (see publish.yml's
# history). Nothing else should ever need this — run it once, then it can
# be deleted.
on:
  workflow_dispatch:

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm deprecate hoodgrow-x402-aa@"*" "Renamed to x402-aa-wallet: https://www.npmjs.com/package/x402-aa-wallet"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
