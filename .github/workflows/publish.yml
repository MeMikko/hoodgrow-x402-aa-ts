name: Publish to npm

# Fires when a GitHub Release is published (Releases -> Draft a new
# release -> tag e.g. v0.1.0 -> Publish release) — doable entirely from a
# phone browser or the GitHub app, no local CLI needed.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Enables npm provenance (a verifiable "built by this exact
      # workflow run" attestation on the published package) regardless of
      # whether NPM_TOKEN is a classic token or you later migrate to
      # npm Trusted Publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # A git tag is just a label — npm publishes whatever package.json
      # says, not the tag. Tagging v0.2.1 without bumping package.json
      # silently republishes the old version and fails with a 403 "cannot
      # publish over previously published versions" that's easy to miss.
      # Fail loudly here instead, before wasting a publish attempt.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag is v$TAG_VERSION but package.json version is $PKG_VERSION — bump package.json and re-tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      # First publish of a brand-new package name needs a real token — npm
      # only lets you configure Trusted Publishing (OIDC, no token) for a
      # package that already exists. Add one at
      # npmjs.com -> Avatar -> Access Tokens -> Generate New Token ->
      # Automation, then paste it as this repo's NPM_TOKEN secret
      # (Settings -> Secrets and variables -> Actions -> New repository
      # secret). Once v0.1.0 is live, you can switch npmjs.com's package
      # settings to Trusted Publishing and drop this secret entirely.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
